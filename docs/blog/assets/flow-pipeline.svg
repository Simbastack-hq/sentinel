<svg viewBox="0 0 880 470" width="880" height="470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <!-- Row 1: repo -> recon -> derive -->
  <rect x="30" y="38" width="120" height="54" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="90" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">your repo</text>

  <line x1="150" y1="65" x2="212" y2="65" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="216" y="38" width="240" height="54" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="336" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">recon: a deterministic digest</text>
  <text x="336" y="78" text-anchor="middle" font-size="12" fill="#57606a">grep + find — no model calls</text>

  <line x1="456" y1="65" x2="518" y2="65" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="522" y="38" width="240" height="54" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="642" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Mimo derives the flows</text>
  <text x="642" y="78" text-anchor="middle" font-size="12" fill="#57606a">prioritized, cached per commit</text>

  <line x1="642" y1="92" x2="642" y2="136" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 2: agent loop container -->
  <rect x="30" y="140" width="820" height="160" rx="8" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="164" font-size="13" font-weight="600" fill="#57606a">each flow × N attempts (defaults: 2 flows × 2 attempts)</text>

  <rect x="70" y="192" width="210" height="58" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="175" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Mimo</text>
  <text x="175" y="234" text-anchor="middle" font-size="12" fill="#57606a">decides the next action</text>

  <line x1="280" y1="221" x2="332" y2="221" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="336" y="192" width="210" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="441" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Playwright</text>
  <text x="441" y="234" text-anchor="middle" font-size="12" fill="#57606a">drives the browser</text>

  <line x1="546" y1="221" x2="598" y2="221" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="602" y="192" width="210" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="707" y="215" text-anchor="middle" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">api_request</text>
  <text x="707" y="234" text-anchor="middle" font-size="12" fill="#57606a">asserts backend state</text>

  <path d="M 707 250 L 707 272 L 175 272 L 175 254" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="441" y="288" text-anchor="middle" font-size="12" fill="#57606a">hard cap: 90 tool calls per attempt, then the only move left is finish</text>

  <line x1="145" y1="300" x2="145" y2="344" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 3: union -> vision -> report -->
  <rect x="30" y="348" width="230" height="54" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">findings unioned</text>
  <text x="145" y="388" text-anchor="middle" font-size="12" fill="#57606a">across attempts, worst verdict kept</text>

  <line x1="260" y1="375" x2="322" y2="375" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="326" y="348" width="240" height="54" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="446" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">vision pass on every screen</text>
  <text x="446" y="388" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">mimo-v2-omni, up to 8 screens</text>

  <line x1="566" y1="375" x2="628" y2="375" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="632" y="348" width="218" height="54" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="741" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">one combined report</text>
  <text x="741" y="388" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">report.md + report.html</text>

  <!-- legend -->
  <rect x="30" y="432" width="12" height="12" rx="3" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="50" y="443" font-size="12" fill="#57606a">model call</text>
  <rect x="130" y="432" width="12" height="12" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="443" font-size="12" fill="#57606a">deterministic plumbing</text>
</svg>
